<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozinha - Cia das Pizzas</title>
    <link rel="stylesheet" href="main.css">
    <style>
        body { background: #0f1416; font-family: sans-serif; margin: 0; }
        .cozinha-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 1.5rem; border-bottom: 1px solid rgba(196,126,58,0.3);
        }
        .cozinha-header h1 { margin: 0; font-size: 1.3rem; color: #e0ddd8; }
        .status-conexao { font-size: 0.85rem; padding: 0.3rem 0.75rem; border-radius: 20px; }
        .status-conexao.online { background: rgba(46,125,50,0.2); color: #6fcf73; border: 1px solid #2e7d32; }
        .status-conexao.offline { background: rgba(160,40,40,0.2); color: #ff8a80; border: 1px solid #a02828; }
        .cozinha-toolbar { display:flex; gap:0.75rem; padding: 0.75rem 1.5rem; }
        .cozinha-toolbar button, .pedido-card button {
            cursor:pointer; padding: 0.55rem 1rem; border-radius: 4px;
            border: 1px solid #c47e3a; background: #c47e3a; color: #fff;
        }
        #lista-pedidos {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem; padding: 1.5rem;
        }
        .pedido-card {
            background: rgba(15,20,22,0.7); border: 1px solid rgba(196,126,58,0.4);
            border-radius: 12px; padding: 1rem; color: #e0ddd8; position: relative;
        }
        .pedido-card.novo { border-color: #c47e3a; box-shadow: 0 0 0 2px rgba(196,126,58,0.4); }
        .pedido-card h2 { margin: 0 0 0.5rem; color: #c47e3a; font-size: 1.15rem; }
        .pedido-card .hora { font-size: 0.75rem; color: #999; float: right; }
        .pedido-card .itens { margin: 0.5rem 0; padding-left: 1.2rem; }
        .pedido-card .total { font-weight: 600; margin-top: 0.5rem; color: #c47e3a; }
        .vazio { padding: 3rem; text-align: center; color: #888; width: 100%; grid-column: 1 / -1; }
        #area-impressao { display: none; }
        @media print {
            body * { visibility: hidden; }
            #area-impressao, #area-impressao * { visibility: visible; }
            #area-impressao {
                display: block; position: absolute; top: 0; left: 0;
                width: 72mm; padding: 2mm; color: #000; background: #fff;
                font: 12px 'Courier New', monospace;
            }
            @page { size: 80mm auto; margin: 2mm; }
        }
    </style>
</head>
<body>
    <header class="cozinha-header">
        <h1>Cia das Pizzas — Cozinha</h1>
        <span id="status-conexao" class="status-conexao offline" role="status">Conectando...</span>
    </header>

    <div class="cozinha-toolbar">
        <button type="button" id="btn-testar">Testar impressão</button>
    </div>

    <main id="lista-pedidos" aria-live="polite">
        <p class="vazio">Carregando pedidos...</p>
    </main>
    <div id="area-impressao" aria-hidden="true"></div>

    <script>
        const listaEl = document.getElementById('lista-pedidos');
        const areaImpressao = document.getElementById('area-impressao');
        const statusEl = document.getElementById('status-conexao');
        const pedidosConhecidos = new Set();
        let primeiraConsulta = true;

        function escapeHtml(value) {
            return String(value || '').replace(/&/g, '&amp;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function formatPrice(value) {
            return 'R$ ' + Number(value || 0).toFixed(2).replace('.', ',');
        }

        function setConnectionState(connected) {
            statusEl.textContent = connected ? 'Conectado' : 'Sem conexão';
            statusEl.classList.toggle('online', connected);
            statusEl.classList.toggle('offline', !connected);
        }

        function renderOrder(order, isNew) {
            if (!order || pedidosConhecidos.has(String(order.id))) return;
            pedidosConhecidos.add(String(order.id));

            const emptyMessage = listaEl.querySelector('.vazio');
            if (emptyMessage) emptyMessage.remove();

            const card = document.createElement('article');
            card.className = `pedido-card${isNew ? ' novo' : ''}`;
            const time = order.criadoEm
                ? new Date(order.criadoEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                : '';
            const customer = order.cliente || {};
            const items = Array.isArray(order.itens) ? order.itens : [];
            const itemsHtml = items.map((item) => {
                const name = item.name || item.nome || 'Item';
                const qty = Number(item.qty || item.qtd || 1);
                return `<li>${qty}x ${escapeHtml(name)} — ${formatPrice(Number(item.price || 0) * qty)}</li>`;
            }).join('');

            card.innerHTML = `
                <span class="hora">${escapeHtml(time)}</span>
                <h2>Pedido #${escapeHtml(order.id)}</h2>
                <p><strong>${escapeHtml(customer.nome)}</strong> · ${escapeHtml(customer.telefone)}</p>
                <p>${escapeHtml(customer.rua || customer.endereco)}, ${escapeHtml(customer.numero)} — ${escapeHtml(customer.bairro)}</p>
                ${customer.obs ? `<p>Referência: ${escapeHtml(customer.obs)}</p>` : ''}
                <ul class="itens">${itemsHtml}</ul>
                ${order.obsGeral ? `<p>Observações: ${escapeHtml(order.obsGeral)}</p>` : ''}
                <p class="total">Total: ${formatPrice(order.total)} · Pagamento: ${escapeHtml(order.pagamento)}</p>
                <button type="button" class="btn-imprimir">Imprimir comanda</button>`;

            card.querySelector('.btn-imprimir').addEventListener('click', () => printOrder(order));
            listaEl.prepend(card);
        }

        function buildReceipt(order) {
            const customer = order.cliente || {};
            const itemsHtml = (order.itens || []).map((item) => {
                const qty = Number(item.qty || item.qtd || 1);
                const name = item.name || item.nome || 'Item';
                return `<div>${qty}x ${escapeHtml(name)}</div>
                    <div>${formatPrice(Number(item.price || 0) * qty)}</div>`;
            }).join('');
            const address = [customer.rua || customer.endereco, customer.numero].filter(Boolean).join(', ');
            const createdAt = order.criadoEm ? new Date(order.criadoEm).toLocaleString('pt-BR') : '';

            return `<div style="text-align:center;font-weight:bold;font-size:14px">CIA DAS PIZZAS</div>
                <div style="text-align:center">Pedido #${escapeHtml(order.id)}</div>
                <div style="text-align:center">${escapeHtml(createdAt)}</div>
                <hr>
                <div><strong>Cliente:</strong> ${escapeHtml(customer.nome)}</div>
                <div><strong>Telefone:</strong> ${escapeHtml(customer.telefone)}</div>
                <div><strong>Endereço:</strong> ${escapeHtml(address)}</div>
                <div><strong>Bairro:</strong> ${escapeHtml(customer.bairro)}</div>
                ${customer.obs ? `<div><strong>Referência:</strong> ${escapeHtml(customer.obs)}</div>` : ''}
                <hr>${itemsHtml}<hr>
                ${order.obsGeral ? `<div><strong>Observações:</strong> ${escapeHtml(order.obsGeral)}</div>` : ''}
                <div><strong>Total: ${formatPrice(order.total)}</strong></div>
                <div><strong>Pagamento:</strong> ${escapeHtml(order.pagamento)}</div>`;
        }

        function printOrder(order) {
            areaImpressao.innerHTML = buildReceipt(order);
            window.print();
        }

        async function loadOrders() {
            try {
                const response = await fetch('/api/pedidos', { cache: 'no-store' });
                if (!response.ok) throw new Error(`Falha ao consultar pedidos (${response.status}).`);

                const orders = await response.json();
                if (!Array.isArray(orders)) throw new Error('Resposta inválida ao consultar pedidos.');
                setConnectionState(true);

                orders.forEach((order) => {
                    renderOrder(order, !primeiraConsulta);
                });
                if (primeiraConsulta && orders.length === 0) {
                    listaEl.innerHTML = '<p class="vazio">Nenhum pedido recebido ainda.</p>';
                }
                primeiraConsulta = false;
            } catch (error) {
                setConnectionState(false);
                console.error('Não foi possível atualizar os pedidos:', error);
            }
        }

        document.getElementById('btn-testar').addEventListener('click', () => {
            printOrder({
                id: 'TESTE',
                criadoEm: new Date().toISOString(),
                cliente: {
                    nome: 'Impressora de Teste',
                    telefone: '(47) 99999-9999',
                    rua: 'Rua Principal',
                    numero: '123',
                    bairro: 'Centro',
                    obs: 'Perto da praça'
                },
                itens: [{ qty: 1, name: 'Pizza de Teste Grande', price: 49.9 }],
                total: 49.9,
                pagamento: 'pix',
                obsGeral: 'Teste do sistema'
            });
        });

        loadOrders();
        window.setInterval(loadOrders, 3000);
    </script>
</body>
</html>
